[tool.poetry]
name = "ai-receptionist"
version = "0.1.0"
description = "100Solutionz Universal AI Receptionist Platform"
authors = ["100Solutionz"]
packages = [{include = "receptionist", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11"
fastapi = ">=0.104.0"
uvicorn = {extras = ["standard"], version = ">=0.24.0"}
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.0"}
aiosqlite = ">=0.19.0"
aiomysql = ">=0.2.0"
alembic = ">=1.12.0"
pydantic = ">=2.5.0"
pydantic-settings = ">=2.1.0"
langgraph = ">=0.2.0"
langchain-core = ">=0.3.0"
langchain-openai = ">=0.2.0"
langchain-anthropic = ">=0.3.0"
openai = ">=1.0.0"
anthropic = ">=0.39.0"
streamlit = ">=1.28.0"
apscheduler = ">=3.10.0"
python-dotenv = ">=1.0.0"
httpx = ">=0.25.0"
PyJWT = ">=2.8.0"
passlib = {extras = ["bcrypt"], version = ">=1.7.4"}
python-multipart = ">=0.0.6"
email-validator = ">=2.1.0"
pytz = ">=2023.3"
tenacity = ">=8.2.0"
structlog = ">=23.2.0"
prometheus-client = ">=0.19.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.1.0"
httpx = ">=0.25.0"
ruff = ">=0.1.0"
mypy = ">=1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Tests and ops scripts deliberately resolve "today" in the machine's local timezone.
"tests/**" = ["DTZ011"]
"scripts/**" = ["DTZ011"]
